name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # For a pull_request event, actions/checkout's default ref (github.ref) resolves to
  # refs/pull/<PR>/merge -- a GitHub-generated commit that merges the PR branch into its base
  # branch. Testing that (rather than the PR branch's raw tip) catches breakage that only shows
  # up once this branch is combined with whatever's landed on the base branch since it was cut,
  # not just breakage in the branch considered alone. For a push to main directly, there's no
  # merge to preview -- github.ref is just main's own tip, so this job is the only one that runs
  # (see test-branch-as-is's `if` below) and behaves exactly as before this file changed.
  test-macos-merge-result:
    name: Test (macOS, after merge into base branch)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: check_interactive_checklists.sh compares the commit in
          # Tests/Scripted/last-run-mac.md against this branch, which a shallow clone cannot see.
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # `github.head_ref` is the PR's source branch, and is empty on a push to main -- which the
      # script reads as "no branch to check against" and skips the Last-run half. That is the
      # behaviour main needs: a checklist's heading names the feature branch that ran it, and goes
      # on naming it after the merge, so enforcing it on main would fail every push forever.
      - name: Verify interactive test checklists are complete
        run: ./scripts/check_interactive_checklists.sh --branch "${{ github.head_ref }}"

  # Only meaningful for pull_request: checks out the PR branch's actual tip commit (not the merge
  # preview above), so a PR that only passes once merged with newer base-branch changes -- but
  # would fail standalone -- still gets caught, rather than only ever being tested combined with
  # that state.
  test-macos-branch-as-is:
    name: Test (macOS, branch as-is, unmerged)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, for the same reason as the other job.
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Verify interactive test checklists are complete
        run: ./scripts/check_interactive_checklists.sh --branch "${{ github.head_ref }}"

  # **The two jobs above are both macOS, so neither of them can see a platform divergence.**
  # These two mirror them on Linux, one for the merge preview and one for the branch as it stands,
  # so each platform answers the same two questions and a job name says which platform asked. The suite is
  # one suite run in two places rather than two suites: there is no `#if os(Linux)` anywhere in `Sources/`,
  # and exactly 7 of the tests are Linux-only. The other ~1,042 are the same tests the Mac runs, and running
  # them against a different Foundation is the only thing that catches shared code behaving differently.
  #
  # That is not hypothetical. `WriteDebounceTests` is green in the Mac's 1,751 and fails 4 of its 7 on Linux,
  # returning `writes -> 0`, because a `@MainActor` swift-testing test does not run on the main thread there
  # and so a `Timer` on `RunLoop.main` never fires (measured 2026-09-09, `docs/linux-port.md`). Earlier, the
  # same gap let `FileManager.contentsOfDirectory(at:)` return an empty array for a symlinked directory on
  # Linux where Darwin follows it -- which `DatabaseBootstrap` reported as a database created successfully.
  # Both were found by somebody remembering to run the suite on the Linux box by hand. This job is that,
  # remembered automatically.
  test-linux-merge-result:
    name: Test (Linux, after merge into base branch)
    runs-on: ubuntu-latest
    # The official image on the 6.2 line and on noble, which is the language version and the distribution
    # the port is measured against -- `swift-6.2-RELEASE-ubuntu24.04` in `docs/systems-info.md`. A container
    # rather than a setup action so the compiler is stated in this file rather than resolved by a third
    # party, and `6.2` rather than `latest` so a Swift 6.3 release cannot quietly become the thing CI tests.
    #
    # **It floats within the patch releases, and the Linux box does not.** This tag is 6.2.4 today where
    # that machine is on 6.2.0, so the two are the same language version and not the same compiler. That is
    # deliberate -- pinning `6.2.0-noble` would freeze CI on a patch nobody would remember to bump -- and it
    # is the first thing to check if this job ever fails where a hand-run on the Linux box passes.
    # The macOS jobs above float in the same way, on `latest-stable`.
    container: swift:6.2-noble
    steps:
      # No `fetch-depth: 0` here, unlike the macOS jobs: that is for
      # `check_interactive_checklists.sh`, which this job does not run. The two jobs above already do, and
      # the answer does not depend on the platform.
      - uses: actions/checkout@v5

      # **What the Linux target graph needs and Darwin does not.** `SQLite3`, `CDBus` and `CGtk` are
      # system-library targets over headers that ship with no SDK here, and unlike the macOS graph this one
      # holds a `FacetLinux` executable, so `swift build` reaches the GTK stack that nothing else builds.
      # Each of these is recorded as installed on the Linux box in `docs/systems-info.md`.
      # **What the Linux target graph needs and Darwin does not**, plus `dbus` for the daemon the step
      # below starts. `libdbus-1-dev` is the library `CDBus` links; `dbus` is the bus itself.
      - name: Install the system libraries the Linux graph links
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config dbus libsqlite3-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev

      # **The build and the tests must not run as root, and one test proves it rather than arguing it.**
      # `DevicePINSourceTests.testAFileThatWillNotGiveUpItsCopyIsNotReportedAsSettled` makes a config file
      # `0o400` so that a write is refused, and asserts the app does not then claim to have settled.
      # **Root ignores mode bits**, so the write succeeds, the copy is cleared, and the test fails against an
      # app doing exactly the right thing. Measured in this image on 2026-09-09: as root a `0400` file is
      # written without complaint; as an ordinary user it is refused. A container job runs as root unless it
      # is told otherwise, so it is told.
      #
      # That test's own comment records this trap arriving once before from the other direction, when
      # `.immutable` turned out to be a BSD flag corelibs does not implement. A permission the platform
      # declines to enforce reads as an app misbehaving, both times.
      #
      # The bus configuration is written here, by root, because the heredoc is unreadable once it is nested
      # inside the `su` below. `ci` only ever needs to read it.
      - name: Make an unprivileged user for the build and the tests
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          cat > /tmp/facet-bus.conf <<'CONF'
          <busconfig>
            <type>system</type>
            <listen>unix:tmpdir=/tmp</listen>
            <policy context="default">
              <allow user="*"/>
              <allow own="*"/>
              <allow send_destination="*"/>
              <allow receive_sender="*"/>
            </policy>
          </busconfig>
          CONF
          chmod 0644 /tmp/facet-bus.conf

      # Builds the `FacetLinux` executable as well as the core, which is the half of the graph the macOS
      # jobs never compile. It does not build an app bundle and is not meant to.
      - name: Build
        run: su ci -c 'swift build'

      # **A system bus with no BlueZ on it, which is exactly what a runner is.** Five of the seven
      # `SystemBusTests` ask `org.freedesktop.DBus` and nothing else, so a bus is the whole of what they
      # need -- measured 2026-09-09 against a private daemon, where all five pass with no BlueZ present and
      # only the two adapter-bound ones fail. `dbus_bus_get(DBUS_BUS_SYSTEM)` in `SystemBus.init` reads
      # `DBUS_SYSTEM_BUS_ADDRESS`, so nothing in the app has to know about this.
      #
      # The daemon is started by `ci` rather than by root, so the socket belongs to whoever connects to it.
      # It lives inside the same `su` as the tests because the address has to reach them, which saves
      # exporting it through `GITHUB_ENV` and keeps the bus with the thing that uses it.
      #
      # **Two tests are skipped rather than the whole `SystemBusTests` suite**, which is what this job did
      # until the five above were measured. `theNestedObjectTreeIsWalkedToItsLeaves` and
      # `aSignalArrivesAndItsValuesAreTyped` both look for a real `org.bluez.Adapter1` and record an issue
      # when there is none, so they cannot pass on any runner and belong with `Tests/Scripted/`: their
      # absence is a fact about the machine rather than about the code.
      #
      # That leaves **1,047 tests -- 590 under XCTest and 457 under swift-testing**.
      #
      # **One of the five passes for a different reason here than on a developer's machine**, and it is worth
      # knowing which. `aByteArrayArgumentIsAcceptedByTheWire` calls `org.bluez` and asserts only that the
      # call is *refused*. With BlueZ present the refusal is `UnknownObject`, from BlueZ, about the object
      # path; with no BlueZ it is `ServiceUnknown`, from the bus, because nothing owns the name. So here it
      # still proves libdbus marshalled the byte array and put it on the wire -- its stated claim -- but it
      # stops at the bus and proves nothing about what BlueZ accepts.
      - name: Test
        run: |
          su ci -c '
            set -e
            dbus-daemon --config-file=/tmp/facet-bus.conf --print-address --fork > /tmp/facet-bus.addr
            export DBUS_SYSTEM_BUS_ADDRESS=$(cat /tmp/facet-bus.addr)
            swift test --skip theNestedObjectTreeIsWalkedToItsLeaves --skip aSignalArrivesAndItsValuesAreTyped
          '

  # **The same job against the branch's own tip**, mirroring `test-macos-branch-as-is` above: the job before
  # this one tests the merge preview, so on its own it can pass a branch that only works once combined with
  # whatever has landed on the base since. Every step here is identical to that job's and the reasoning for
  # each is written out there rather than repeated -- if one changes, both change.
  test-linux-branch-as-is:
    name: Test (Linux, branch as-is, unmerged)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install the system libraries the Linux graph links
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config dbus libsqlite3-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Make an unprivileged user for the build and the tests
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          cat > /tmp/facet-bus.conf <<'CONF'
          <busconfig>
            <type>system</type>
            <listen>unix:tmpdir=/tmp</listen>
            <policy context="default">
              <allow user="*"/>
              <allow own="*"/>
              <allow send_destination="*"/>
              <allow receive_sender="*"/>
            </policy>
          </busconfig>
          CONF
          chmod 0644 /tmp/facet-bus.conf

      - name: Build
        run: su ci -c 'swift build'

      - name: Test
        run: |
          su ci -c '
            set -e
            dbus-daemon --config-file=/tmp/facet-bus.conf --print-address --fork > /tmp/facet-bus.addr
            export DBUS_SYSTEM_BUS_ADDRESS=$(cat /tmp/facet-bus.addr)
            swift test --skip theNestedObjectTreeIsWalkedToItsLeaves --skip aSignalArrivesAndItsValuesAreTyped
          '

  # The one job branch protection should require by name. Individual test jobs above can be
  # renamed, added, or removed freely without ever touching the branch protection setting again --
  # only this job's name has to stay stable. `if: always()` makes sure it still runs (and can
  # report failure) even when a job it depends on fails, instead of being skipped itself.
  all-tests-pass:
    name: All tests pass
    runs-on: ubuntu-latest
    needs:
      - test-macos-merge-result
      - test-macos-branch-as-is
      - test-linux-merge-result
      - test-linux-branch-as-is
    if: always()
    steps:
      - name: Check required jobs succeeded
        run: |
          if [[ "${{ needs.test-macos-merge-result.result }}" != "success" ]]; then
            echo "test-macos-merge-result: ${{ needs.test-macos-merge-result.result }}"
            exit 1
          fi
          # test-branch-as-is is PR-only (see its `if` above) -- "skipped" is expected on a
          # push-to-main event, not a failure.
          if [[ "${{ needs.test-macos-branch-as-is.result }}" != "success" && "${{ needs.test-macos-branch-as-is.result }}" != "skipped" ]]; then
            echo "test-macos-branch-as-is: ${{ needs.test-macos-branch-as-is.result }}"
            exit 1
          fi
          if [[ "${{ needs.test-linux-merge-result.result }}" != "success" ]]; then
            echo "test-linux-merge-result: ${{ needs.test-linux-merge-result.result }}"
            exit 1
          fi
          # Skipped is expected of this one on a push to main, exactly as for its macOS counterpart.
          if [[ "${{ needs.test-linux-branch-as-is.result }}" != "success" && "${{ needs.test-linux-branch-as-is.result }}" != "skipped" ]]; then
            echo "test-linux-branch-as-is: ${{ needs.test-linux-branch-as-is.result }}"
            exit 1
          fi
          echo "All required jobs passed."
