<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
  <title>Facet architecture model: the core, its ports, and the platform adapters</title>
  <desc>FacetCore is the circle. Every platform capability leaves it through a named port. Each square is one
  capability's adapters, holding a slot per platform, of which the build selects one. What travels the arm is the
  same whichever slot is built.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowMissing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="1200" fill="#f6f6f4"/>

  <!-- ══════════ title ══════════ -->
  <text x="48" y="52" font-size="26" font-weight="600" fill="#0f172a" font-family="Newsreader,Georgia,serif">The shape Facet is being moved into</text>
  <text x="48" y="76" font-size="13.5" fill="#475569">Inside the circle is the core. It knows nothing about the platform it runs on. Every platform capability leaves through a named port.</text>
  <text x="48" y="95" font-size="13.5" fill="#475569">Each square holds one capability's adapters, a slot per platform, of which the build selects one. What travels the arm never changes.</text>

  <!-- ══════════ the circle ══════════ -->
  <circle cx="640" cy="560" r="252" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="640" cy="560" r="240" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <text x="640" y="392" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a" font-family="Newsreader,Georgia,serif">FacetCore</text>
  <text x="640" y="412" text-anchor="middle" font-size="10.5" fill="#64748b" letter-spacing="1.4">DOES NOT KNOW WHAT IT IS RUNNING ON</text>

  <!-- modules inside, in three bands, with arms between them -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <!-- band 1: what the app decides -->
    <rect x="472" y="438" width="336" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="640" y="456" font-size="9.5" fill="#64748b" letter-spacing="1.2">THE RULES</text>
    <text x="640" y="472" font-size="10.5">DeviceCommandRules · DailyLimitEnforcement · ManualTimerRules</text>
    <text x="640" y="484" font-size="10.5">PauseMenuRules · GoogleAccountRules · DeviceScanRules</text>

    <!-- band 2: what it remembers -->
    <rect x="452" y="506" width="376" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="640" y="524" font-size="9.5" fill="#64748b" letter-spacing="1.2">WHAT IT REMEMBERS</text>
    <text x="640" y="540" font-size="10.5">SettingStore · CategoryStore · FaceStore · TimeEntryStore</text>
    <text x="640" y="552" font-size="10.5">DeviceEventRecorder · DevicePairingRecorder</text>

    <!-- band 3: what it does over time -->
    <rect x="462" y="574" width="356" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="640" y="592" font-size="9.5" fill="#64748b" letter-spacing="1.2">WHAT IT DOES OVER TIME</text>
    <text x="640" y="608" font-size="10.5">CubeLock · FaceColourSync · DeviceSettingsSync</text>
    <text x="640" y="620" font-size="10.5">HistoryIngestor · CalendarSync · DeviceReconnector</text>

    <!-- band 4: what it says -->
    <rect x="502" y="642" width="276" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="640" y="660" font-size="9.5" fill="#64748b" letter-spacing="1.2">WHAT IT SAYS</text>
    <text x="640" y="674" font-size="10.5">StatusItemTitle · DurationFormat · ReportEntryText</text>
  </g>

  <!-- arms between bands, inside the circle -->
  <g stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowSmall)" opacity="0.7">
    <line x1="640" y1="490" x2="640" y2="502"/>
    <line x1="640" y1="558" x2="640" y2="570"/>
    <line x1="640" y1="626" x2="640" y2="638"/>
  </g>
  <text x="640" y="700" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">modules inside link to one another freely</text>

  <!-- ══════════ squares ══════════ -->
  <!-- each: title, then a slot per platform. macOS filled, the others waiting. -->

  <!-- N: Radio -->
  <g>
    <rect x="535" y="118" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="640" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Radio</text>
    <rect x="547" y="150" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="640" y="165" text-anchor="middle" font-size="10" fill="#ffffff">macOS: CoreBluetooth</text>
    <rect x="547" y="176" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="640" y="191" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: BlueZ</text>
    <rect x="547" y="202" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="640" y="217" text-anchor="middle" font-size="10" fill="#94a3b8">Windows</text>
  </g>
  <line x1="640" y1="308" x2="640" y2="234" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="576" y="256" width="128" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="640" y="269" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">connect, read,</text>
  <text x="640" y="280" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">write, subscribe</text>

  <!-- NE: Secrets -->
  <g>
    <rect x="962" y="238" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="1067" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Secrets</text>
    <rect x="974" y="270" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="1067" y="285" text-anchor="middle" font-size="10" fill="#ffffff">macOS: Keychain</text>
    <circle cx="1150" cy="252" r="7" fill="#059669"/>
    <text x="1150" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>
    <rect x="974" y="296" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="1067" y="311" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: secret-tool</text>
    <rect x="974" y="322" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="1067" y="337" text-anchor="middle" font-size="10" fill="#94a3b8">Windows</text>
  </g>
  <line x1="822" y1="440" x2="960" y2="336" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="836" y="368" width="122" height="30" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="897" y="381" text-anchor="middle" font-size="9.5" fill="#065f46" font-weight="600">store, look up,</text>
  <text x="897" y="392" text-anchor="middle" font-size="9.5" fill="#065f46" font-weight="600">clear</text>

  <!-- E: Storage -->
  <g>
    <rect x="1022" y="504" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="1127" y="526" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Storage</text>
    <rect x="1034" y="536" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="1127" y="551" text-anchor="middle" font-size="10" fill="#ffffff">SQLite</text>
    <rect x="1034" y="562" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="1127" y="577" text-anchor="middle" font-size="10" fill="#94a3b8">an API</text>
    <rect x="1034" y="588" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="1127" y="603" text-anchor="middle" font-size="10" fill="#94a3b8">in memory, for tests</text>
  </g>
  <line x1="892" y1="560" x2="1020" y2="560" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="906" y="530" width="100" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="956" y="543" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">the categories,</text>
  <text x="956" y="554" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">the settings</text>

  <!-- SE: Menu bar -->
  <g>
    <rect x="962" y="770" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="1067" y="792" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Menu bar</text>
    <rect x="974" y="802" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="1067" y="817" text-anchor="middle" font-size="10" fill="#ffffff">macOS: NSStatusItem</text>
    <rect x="974" y="828" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="1067" y="843" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: AppIndicator</text>
    <rect x="974" y="854" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="1067" y="869" text-anchor="middle" font-size="10" fill="#94a3b8">Windows</text>
  </g>
  <line x1="822" y1="680" x2="960" y2="784" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="838" y="716" width="124" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="900" y="729" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">a title, a menu,</text>
  <text x="900" y="740" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">a click and its side</text>

  <!-- S: Windows and dialogs -->
  <g>
    <rect x="535" y="890" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="640" y="912" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Windows and dialogs</text>
    <rect x="547" y="922" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="640" y="937" text-anchor="middle" font-size="10" fill="#ffffff">macOS: AppKit</text>
    <rect x="547" y="948" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="640" y="963" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: GTK</text>
    <rect x="547" y="974" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="640" y="989" text-anchor="middle" font-size="10" fill="#94a3b8">Windows</text>
  </g>
  <line x1="640" y1="812" x2="640" y2="886" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="566" y="834" width="148" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="640" y="847" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">what to show, and</text>
  <text x="640" y="858" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">which answer came back</text>

  <!-- SW: Lifecycle -->
  <g>
    <rect x="108" y="770" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="213" y="792" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Starting and stopping</text>
    <rect x="120" y="802" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="213" y="817" text-anchor="middle" font-size="10" fill="#ffffff">macOS: NSApplication</text>
    <rect x="120" y="828" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="213" y="843" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: gtk_main</text>
    <rect x="120" y="854" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="213" y="869" text-anchor="middle" font-size="10" fill="#94a3b8">Windows</text>
  </g>
  <line x1="458" y1="680" x2="320" y2="784" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="318" y="716" width="124" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="380" y="729" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">may I stop yet,</text>
  <text x="380" y="740" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">and now you may</text>

  <!-- W: Clock -->
  <g>
    <rect x="48" y="504" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="153" y="526" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">The clock</text>
    <rect x="60" y="536" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="153" y="551" text-anchor="middle" font-size="10" fill="#ffffff">macOS: RunLoop.main</text>
    <rect x="60" y="562" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="153" y="577" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: g_timeout_add</text>
    <rect x="60" y="588" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="153" y="603" text-anchor="middle" font-size="10" fill="#94a3b8">driven by hand, for tests</text>
  </g>
  <line x1="388" y1="560" x2="260" y2="560" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="278" y="530" width="94" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="325" y="543" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">wake me in</text>
  <text x="325" y="554" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">N seconds</text>

  <!-- NW: Files and folders -->
  <g>
    <rect x="108" y="238" width="210" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="213" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Files and folders</text>
    <rect x="120" y="270" width="186" height="22" rx="3" fill="#0f172a"/>
    <text x="213" y="285" text-anchor="middle" font-size="10" fill="#ffffff">macOS: Application Support</text>
    <rect x="120" y="296" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="213" y="311" text-anchor="middle" font-size="10" fill="#94a3b8">Linux: XDG</text>
    <rect x="120" y="322" width="186" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="213" y="337" text-anchor="middle" font-size="10" fill="#94a3b8">Windows: AppData</text>
  </g>
  <line x1="458" y1="440" x2="320" y2="336" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
  <rect x="322" y="368" width="120" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="382" y="381" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">where my data</text>
  <text x="382" y="392" text-anchor="middle" font-size="9.5" fill="#78350f" font-weight="600">lives, and the lock</text>

  <!-- ══════════ legend ══════════ -->
  <line x1="48" y1="1046" x2="1232" y2="1046" stroke="#e2e8f0" stroke-width="1"/>

  <g font-size="11.5" fill="#334155">
    <!-- solid arm -->
    <line x1="52" y1="1080" x2="102" y2="1080" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="112" y="1084">The port exists. Today that is <tspan font-weight="600">one of eight</tspan>: SecretStore.</text>

    <!-- dashed arm -->
    <line x1="52" y1="1108" x2="102" y2="1108" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowMissing)" marker-start="url(#arrowMissing)"/>
    <text x="112" y="1112">No port yet. The core reaches the platform directly, or the code sits on the wrong side.</text>

    <!-- filled slot -->
    <rect x="640" y="1071" width="52" height="17" rx="3" fill="#0f172a"/>
    <text x="702" y="1084">Built today.</text>

    <!-- empty slot -->
    <rect x="640" y="1099" width="52" height="17" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="702" y="1112">A slot waiting. The build picks one slot per square; the core cannot tell which.</text>
    <circle cx="52" cy="1136" r="7" fill="#059669"/>
    <text x="52" y="1140" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>
    <text x="112" y="1140">Done: the adapter is in the square and the composition root hands it over.</text>
  </g>

  <text x="48" y="1170" font-size="12" fill="#64748b" font-style="italic">Drawn 2026-09-10. The rule this draws is in CLAUDE.md, under "The core is platform-blind, and every platform capability is a port".</text>
  <text x="48" y="1190" font-size="12" fill="#b45309">Where it stands: one square of eight is finished. 29 per cent of Sources/FacetMac is genuinely square-code; the other 66 per cent has not moved inside yet.</text>
</svg>
