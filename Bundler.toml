format_version = 2

[apps.Facet]
identifier = 'au.com.tux.facet'
product = 'FacetMac'
version = '1.0'
# Swift Bundler copies this in; Package.swift excludes it from the target's own resources so
# there is only ever one copy in the bundle.
icon = 'Sources/FacetMac/Resources/AppIcon.icns'

[apps.Facet.plist]
LSUIElement = 1
NSBluetoothAlwaysUsageDescription = "Facet needs Bluetooth to pair with your TimeFlip puck and record flips for activity tracking."
